# Automated dependency update checks.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # ── Library package (root) ────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tehran
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    # This entry covers the whole pnpm workspace, docs/ included. A separate
    # "/docs" entry bumps docs/package.json without the root lockfile, so every
    # one of its PRs failed `pnpm install --frozen-lockfile`.
    ignore:
      # TypeScript 6+ breaks the .d.ts build (see AGENTS.md).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @playwright/experimental-ct-react stopped at 1.62.x; the runner must match it.
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Batch low-risk updates into one PR each; majors stay separate for review.
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  # ── GitHub Actions used by the workflows ──────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci(actions)"
    groups:
      github-actions:
        patterns: ["*"]
